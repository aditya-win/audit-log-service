version: '3.8'

services:
  audit-api:
    build: .
    container_name: audit-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mount local directory for hot-reloading
      - audit_data:/app/data  # Persist the database in a Docker volume
    environment:
      - DATABASE_URL=sqlite:////app/data/audit.db
      - DEBUG=True
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  audit_data:
